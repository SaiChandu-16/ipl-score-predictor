name: Keep API Alive (Render Free Tier)

on:
  schedule:
    - cron: '*/10 6-22 * * *'  # Every 10 min between 6AM–10PM UTC (IPL hours)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API health endpoint
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.API_URL }}/health")
          echo "API responded with HTTP $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "⚠️ API may be down or warming up"
          else
            echo "✅ API is alive"
          fi
