name: Refresh IPL Rosters (ESPNcricinfo)

on:
  schedule:
    # Run weekly on Sundays — picks up any squad changes, trades, injuries
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      use_scraping:
        description: 'Use live scraping (true) or fallback hardcoded squads (false)'
        required: false
        default: 'true'

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install supabase requests beautifulsoup4

      - name: Refresh rosters
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python - <<'EOF'
          import os, sys
          sys.path.insert(0, "backend")
          os.environ["SUPABASE_URL"] = os.environ["SUPABASE_URL"]
          os.environ["SUPABASE_KEY"] = os.environ["SUPABASE_KEY"]

          from app.services.cricket_data_service import refresh_all_rosters
          use_scraping = "${{ github.event.inputs.use_scraping }}" != "false"
          summary = refresh_all_rosters(use_scraping=use_scraping)
          print(f"Roster refresh complete: {summary}")
          EOF

      - name: Trigger API restart to pick up new rosters
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" || true
          echo "Render redeploy triggered ✅"
